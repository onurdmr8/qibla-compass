name: Build Android Release (AAB & APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release.keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating release.keystore with default credentials..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias qiblacompass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass qiblacompass2026 \
              -keypass qiblacompass2026 \
              -dname "CN=QiblaCompass, OU=Mobile, O=Qibla, L=Istanbul, ST=Istanbul, C=TR"
          fi
          ls -lh release.keystore

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB) & APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload AAB Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: qibla-compass-v1.1-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qibla-compass-v1.1-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
